name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Ensure npm LSP dependency
        run: |
          node -e "
            const p=require('./package.json');
            const v=p.dependencies['sysml-v2-lsp'];
            if(v.startsWith('file:')) {
              const m=v.match(/\d+\.\d+\.\d+/);
              console.log('Switching local LSP to npm@'+m[0]);
              const fs=require('fs');
              p.dependencies['sysml-v2-lsp']=m[0];
              fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            } else {
              console.log('Already using npm: '+v);
            }
          "

      - name: Install dependencies
        run: npm install

      - name: Audit (high+ only)
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint src/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Ensure npm LSP dependency
        run: |
          node -e "
            const p=require('./package.json');
            const v=p.dependencies['sysml-v2-lsp'];
            if(v.startsWith('file:')) {
              const m=v.match(/\d+\.\d+\.\d+/);
              console.log('Switching local LSP to npm@'+m[0]);
              const fs=require('fs');
              p.dependencies['sysml-v2-lsp']=m[0];
              fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            } else {
              console.log('Already using npm: '+v);
            }
          "

      - name: Install dependencies
        run: npm install

      - name: Unit Tests
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Ensure npm LSP dependency
        run: |
          node -e "
            const p=require('./package.json');
            const v=p.dependencies['sysml-v2-lsp'];
            if(v.startsWith('file:')) {
              const m=v.match(/\d+\.\d+\.\d+/);
              console.log('Switching local LSP to npm@'+m[0]);
              const fs=require('fs');
              p.dependencies['sysml-v2-lsp']=m[0];
              fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            } else {
              console.log('Already using npm: '+v);
            }
          "

      - name: Install dependencies
        run: npm install

      - name: Integration Tests (Extension Host)
        run: xvfb-run -a npm test
