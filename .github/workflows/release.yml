name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.36.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "REF=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "REF=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "REF=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.REF }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npx eslint src/

      - name: Unit Tests
        run: npm run test:unit

      - name: Integration Tests (Extension Host)
        run: xvfb-run -a npm test

  release:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No tag found"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.TAG }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.TAG }}

      - name: Set package.json version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.VERSION }}" ]; then
            npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version
          fi

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX version
        run: test -f "sysml-v2-support-${{ steps.version.outputs.VERSION }}.vsix"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [<version>]" up to the next "## [" heading or end of file
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog entry found for version $VERSION, using fallback"
            NOTES="No changelog entry for this version."
          fi

          # Write multiline output using delimiter
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.version.outputs.VERSION }}" --yes || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## SysML v2.0 Extension v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Installation
            Download the `.vsix` file and install using:
            ```bash
            code --install-extension sysml-v2-support-${{ steps.version.outputs.VERSION }}.vsix
            ```

            Or install directly from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=JamieD.sysml-v2-support) or [Open VSX Registry](https://open-vsx.org/extension/JamieD/sysml-v2-support).
          files: |
            *.vsix
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

      - name: Publish to VS Code Marketplace
        if: env.VSCODE_MARKETPLACE_TOKEN != ''
        env:
          VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
        run: |
          npx vsce publish --packagePath "sysml-v2-support-${{ steps.version.outputs.VERSION }}.vsix" --pat "$VSCODE_MARKETPLACE_TOKEN" || {
            echo "::warning::Marketplace publish failed (version may already exist)"
          }

      - name: Publish to Open VSX Registry
        if: env.OVSX_TOKEN != ''
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          npx ovsx publish "sysml-v2-support-${{ steps.version.outputs.VERSION }}.vsix" -p "$OVSX_TOKEN" || {
            echo "::warning::Open VSX publish failed (version may already exist)"
          }
